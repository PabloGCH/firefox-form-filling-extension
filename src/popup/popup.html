<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Form Filler</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>AI Form Filler</h1>
      <p id="info-state">No info file loaded. Open settings to load one.</p>
      <p id="models-state">No models loaded. Open settings to add or import one.</p>

      <label id="active-model-label" for="active-model" hidden>Active model</label>
      <select id="active-model" hidden></select>

      <div class="actions">
        <button id="open-settings" type="button">Open settings</button>
        <button id="clear-data" type="button">Clear all data</button>
      </div>
      <p id="popup-status" role="status" aria-live="polite"></p>
    </main>

    <script src="../shared/constants.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
